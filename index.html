<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Roteirizador V4 Geoapify</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="css/style.css"></head><body><header><b>ROTEIRIZADOR LOGÍSTICO</b><span>V4 • GEOAPIFY</span></header><main><section class="panel"><label>BASE — saída e retorno</label><input id="base" placeholder="Endereço completo da base"><label>ENTREGAS — uma por linha</label><textarea id="addresses" placeholder="Rua A, 123 - Pindamonhangaba - SP&#10;Rua B, 456 - Aparecida - SP"></textarea><div class="opts"><label><input type="radio" name="metric" value="time" checked> Menor tempo</label><label><input type="radio" name="metric" value="distance"> Menor distância</label></div><div class="actions"><button id="validate">1. VALIDAR</button><button id="optimize" disabled>2. OTIMIZAR</button><button id="clear" class="secondary">LIMPAR</button></div><div id="status">Cole a base e as entregas.</div><div id="results"></div></section><section class="mapwrap"><div id="map"></div><div id="summary">A rota aparecerá aqui.</div></section></main><script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="https://unpkg.com/leaflet-polylinedecorator@1.6.0/dist/leaflet.polylineDecorator.js"></script><script src="js/app.js"></script></body></html>
